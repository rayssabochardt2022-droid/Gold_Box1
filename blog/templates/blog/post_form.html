
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'blog/css/blog.css' %}">

    <title>{{ titulo_pagina }} | Gold Box</title>
</head>

<body class="pagina-publicacao">

    <header class="cabecalho">
        <div class="logo">
            <h1>GOLD BOX</h1>
            <p>Blog de informações e novidades</p>
        </div>
    </header>

    <main>
        <div class="formulario-publicacao">

            <h2>{{ titulo_pagina }}</h2>

            <p class="descricao-formulario">
                Preencha as informações para criar sua publicação.
            </p>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit">
                    Salvar publicação
                </button>
            </form>

            <p class="voltar-blog">
                <a href="{% url 'blog:post_list' %}">
                    Cancelar e voltar ao blog
                </a>
            </p>

        </div>
    </main>

</body>
</html>

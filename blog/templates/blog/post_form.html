<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ titulo_pagina }} | Gold Box</title>
</head>

<body>

    <header>
        <h1>Gold Box</h1>
        <p>Blog</p>
    </header>

    <main>

        <h2>{{ titulo_pagina }}</h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Salvar publicação
            </button>

            <a href="{% url 'blog:post_list' %}">
                Cancelar
            </a>

        </form>

    </main>

</body>

</html>

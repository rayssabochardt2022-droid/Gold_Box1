
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Dica | Gold Box</title>
</head>

<body>

    <h1>Cadastrar nova dica</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.non_field_errors }}

        <div>
            <label for="{{ form.titulo.id_for_label }}">Título:</label>
            {{ form.titulo }}
            {{ form.titulo.errors }}
        </div>

        <br>

        <div>
            <label for="{{ form.conteudo.id_for_label }}">Conteúdo:</label>
            {{ form.conteudo }}
            {{ form.conteudo.errors }}
        </div>

        <br>

        <div>
            <label for="{{ form.categoria.id_for_label }}">Categoria:</label>
            {{ form.categoria }}
            {{ form.categoria.errors }}
        </div>

        <br>

        <button type="submit">Cadastrar dica</button>

    </form>

    <br>

    <a href="{% url 'lista_dicas' %}">Voltar para dicas</a>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto | Iron Box</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">

</head>

<body>
<main class="pg-container">
    <section class="form-produto">
        <h1>Cadastrar novo Produto</h1>

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="campo">
                <label for="nome">Nome do Produto <span class="obrigatorio">*</span></label>
                <input type="text" id="nome" name="nome"
                       maxlength="150" required
                       value="{{ dados.nome|default:'' }}"
                       placeholder="Ex.: Whey Protein 900g">
            </div>

            <div class="campo">
                <label for="categoria">Categoria <span class="obrigatorio">*</span></label>
                <select id="categoria" name="categoria" required>
                    <option value="">Selecione uma categoria</option>
                    <option value="whey">Whey Protein</option>
                    <option value="creatina">Creatina</option>
                    <option value="pre_treino">Pré-treino</option>
                    <option value="glutamina">Glutamina</option>
                    <option value="hipercalorico">Hipercalórico</option>
                    <option value="termogenico">Termogênico</option>
                    <option value="outros">Outros</option>
                </select>
            </div>

            <div class="campo">
                <label for="marca">Marca <span class="obrigatorio">*</span></label>
                <input type="text" id="marca" name="marca"
                       maxlength="100" required
                       value="{{ dados.marca|default:'' }}"
                       placeholder="Ex.: Max Titanium">
            </div>

            <div class="campo">
                <label for="preco">Preço (R$) <span class="obrigatorio">*</span></label>
                <input type="number" id="preco" name="preco"
                       min="0.01" step="0.01" required
                       value="{{ dados.preco|default:'' }}"
                       placeholder="Ex.: 129.90">
            </div>

            <div class="campo">
                <label for="estoque">Quantidade em estoque <span class="obrigatorio">*</span></label>
                <input type="number" id="estoque" name="estoque"
                       min="0" step="1" required
                       value="{{ dados.estoque|default:'' }}"
                       placeholder="Ex.: 15">
            </div>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" name="descricao"
                          placeholder="Detalhes do produto...">{{ dados.descricao|default:'' }}</textarea>
            </div>

            <div class="campo">
                <label for="imagem">Imagem do produto</label>
                <input type="file" id="imagem" name="imagem"
                       accept="image/*">
            </div>

            <div class="botoes">
                <button type="submit" class="botao principal">
                    <i class="bi bi-plus-circle"></i> Salvar produto
                </button>

                <a href="{% url 'produtos' %}" class="botao secundario">
                    Cancelar
                </a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
